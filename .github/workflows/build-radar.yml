name: Monthly radar refresh
on:
  schedule: [{ cron: "0 9 2 * *" }]  # 2nd of each month, 09:00 UTC
  workflow_dispatch:                  # or run it from the Actions tab

permissions:
  contents: write   # lets the job commit refreshed outputs

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies and a Japanese font for chart labels
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk
          pip install -r requirements.txt
      - name: Pull Google Trends and rebuild outputs
        id: build
        run: |
          set +e
          python -m src.radar_cli
          code=$?
          if [ "$code" = "75" ]; then
            echo "::warning::Google Trends rate-limited every retry; kept last month's outputs."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          exit $code
      - name: Commit refreshed outputs
        if: steps.build.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data reports assets
          git commit -m "data: monthly radar refresh ($(date -u +%Y-%m))" || echo "No changes"
          git push
